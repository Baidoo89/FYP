xt class="text" x="1042.5" y="350" text-anchor="middle" dominant-baseline="middle">Enter recommendation</text><text class="text" x="1042.5" y="380" text-anchor="middle" dominant-baseline="middle">and justification</text><polygon class="decision" points="640,290 775,365 640,440 505,365"/><text class="text" x="640" y="351" text-anchor="middle" dominant-baseline="middle">Recommendation</text><text class="text" x="640" y="379" text-anchor="middle" dominant-baseline="middle">outcome?</text><rect class="warn" x="250" y="250" width="260" height="82" rx="16"/><text class="text" x="380" y="276" text-anchor="middle" dominant-baseline="middle">Request further</text><text class="text" x="380" y="306" text-anchor="middle" dominant-baseline="middle">review</text><rect class="warn" x="250" y="410" width="260" height="82" rx="16"/><text class="text" x="380" y="436" text-anchor="middle" dominant-baseline="middle">Record</text><text class="text" x="380" y="466" text-anchor="middle" dominant-baseline="middle">NOT_RECOMMENDED</text><rect class="node" x="250" y="570" width="260" height="82" rx="16"/><text class="text" x="380" y="596" text-anchor="middle" dominant-baseline="middle">Record</text><text class="text" x="380" y="626" text-anchor="middle" dominant-baseline="middle">RECOMMENDED</text><rect class="audit" x="660" y="650" width="330" height="90" rx="16"/><text class="text" x="825" y="680" text-anchor="middle" dominant-baseline="middle">Save review comment,</text><text class="text" x="825" y="710" text-anchor="middle" dominant-baseline="middle">status history, audit log</text><rect class="audit" x="1080" y="650" width="285" height="90" rx="16"/><text class="text" x="1222.5" y="680" text-anchor="middle" dominant-baseline="middle">Notify HR of</text><text class="text" x="1222.5" y="710" text-anchor="middle" dominant-baseline="middle">next action</text><rect class="terminal" x="1440" y="663" width="140" height="64" rx="32"/><text class="terminalText" x="1510" y="695" text-anchor="midd
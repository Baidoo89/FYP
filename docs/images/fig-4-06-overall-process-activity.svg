hor="middle">complete?</text><rect class="node" x="500" y="900" width="500" height="72" rx="18"/><text class="text" x="750" y="944" text-anchor="middle">Forward application to HR</text><rect class="node" x="500" y="1030" width="500" height="72" rx="18"/><text class="text" x="750" y="1074" text-anchor="middle">HR verifies uploaded evidence</text><polygon class="decision" points="750,1100 945,1160 750,1220 555,1160"/><text class="text" x="750" y="1155" text-anchor="middle">Required evidence</text><text class="text" x="750" y="1183" text-anchor="middle">verified?</text><rect class="node" x="500" y="1305" width="500" height="72" rx="18"/><text class="text" x="750" y="1349" text-anchor="middle">Calculate eligibility score</text><polygon class="decision" points="750,1370 945,1430 750,1490 555,1430"/><text class="text" x="750" y="1425" text-anchor="middle">Meets configured</text><text class="text" x="750" y="1453" text-anchor="middle">threshold?</text><rect class="node" x="500" y="1585" width="500" height="72" rx="18"/><text class="text" x="750" y="1629" text-anchor="middle">Route to committee review</text><polygon class="decision" points="750,1650 945,1710 750,1770 555,1710"/><text class="text" x="750" y="1705" text-anchor="middle">Committee</text><text class="text" x="750" y="1733" text-anchor="middle">recommendation?</text><rect class="node" x="500" y="1875" width="500" height="72" rx="18"/><text class="text" x="750" y="1919" text-anchor="middle">Record authority approval</text><rect class="node" x="500" y="1990" width="500" height="72" rx="18"/><text class="text" x="750" y="2034" text-anchor="middle">Complete workflow and notify applicant</text><circle cx="750" cy="2120" r="28" fill="none" stroke="#111827" stroke-width="4"/><circle cx="750" cy="2120" r="16" fill="#111827"/><path class="arrow" d="M750,94 L750,130"/><path class="arrow" d="M750,202 L750,245"/><path class="arrow" d="M750,317 L750,325"/><path class="arrow" d="M750,445 L750,525"/><path class="arrow" d="M750,
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1500" viewBox="0 0 3600 1500" role="img">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111827"/>
    </marker>
    <marker id="card-one" viewBox="0 0 22 18" refX="21" refY="9" markerWidth="22" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 12 2 L 12 16 M 19 2 L 19 16" fill="none" stroke="#111827" stroke-width="2.5"/>
    </marker>
    <marker id="card-zero-many" viewBox="0 0 25 18" refX="24" refY="9" markerWidth="25" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="5" cy="9" r="3.5" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <path d="M 22 9 L 12 2 M 22 9 L 12 9 M 22 9 L 12 16" fill="none" stroke="#111827" stroke-width="2.5"/>
    </marker>
    <marker id="card-zero-one" viewBox="0 0 25 18" refX="24" refY="9" markerWidth="25" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="5" cy="9" r="3.5" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <path d="M 19 2 L 19 16" fill="none" stroke="#111827" stroke-width="2.5"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; letter-spacing: 0; }
      .title { font-size: 40px; font-weight: 700; }
      .section { font-size: 31px; font-weight: 700; }
      .label { font-size: 31px; font-weight: 600; }
      .state-label { font-size: 35px; font-weight: 600; }
      .small { font-size: 24px; }
      .tiny { font-size: 20px; }
      .entity-name { font-size: 31px; font-weight: 700; }
      .entity-row { font-size: 25px; }
      .transition { font-size: 25px; }
    </style>

  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="1800" y="66" class="title" text-anchor="middle" >Promotion Application State Lifecycle</text><text x="1800" y="105" class="small" text-anchor="middle" >UML state-machine representation of controlled review, correction, escalation, and completion paths</text><circle cx="85" cy="630" r="24" fill="#111827"/><g><rect x="150" y="560" width="280" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="290" y="640" class="state-label" text-anchor="middle"><tspan x="290" dy="0">Draft</tspan></text></g><g><rect x="510" y="560" width="300" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="660" y="640" class="state-label" text-anchor="middle"><tspan x="660" dy="0">Submitted</tspan></text></g><g><rect x="900" y="560" width="360" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="1080" y="623" class="state-label" text-anchor="middle"><tspan x="1080" dy="0">Department</tspan><tspan x="1080" dy="34">Review</tspan></text></g><g><rect x="1360" y="560" width="340" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="1530" y="640" class="state-label" text-anchor="middle"><tspan x="1530" dy="0">HR Verification</tspan></text></g><g><rect x="1800" y="560" width="360" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="1980" y="623" class="state-label" text-anchor="middle"><tspan x="1980" dy="0">Committee</tspan><tspan x="1980" dy="34">Review</tspan></text></g><g><rect x="2260" y="560" width="330" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="2425" y="640" class="state-label" text-anchor="middle"><tspan x="2425" dy="0">Recommended</tspan></text></g><g><rect x="2690" y="560" width="390" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="2885" y="623" class="state-label" text-anchor="middle"><tspan x="2885" dy="0">Approved by</tspan><tspan x="2885" dy="34">Authority</tspan></text></g><g><rect x="3180" y="560" width="280" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="3320" y="640" class="state-label" text-anchor="middle"><tspan x="3320" dy="0">Completed</tspan></text></g><circle cx="3545" cy="630" r="30" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><circle cx="3545" cy="630" r="19" fill="#111827"/><path d="M 109 630 L 150 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="120.75" y="496" width="178.5" height="31" fill="#FFFFFF"/><text x="210" y="520" class="transition" text-anchor="middle" >start application</text><path d="M 430 630 L 510 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="344" y="581" width="252" height="31" fill="#FFFFFF"/><text x="470" y="605" class="transition" text-anchor="middle" >submit complete evidence</text><path d="M 810 630 L 900 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="729" y="581" width="252" height="31" fill="#FFFFFF"/><text x="855" y="605" class="transition" text-anchor="middle" >route to scoped reviewer</text><path d="M 1260 630 L 1360 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="1245" y="581" width="130" height="31" fill="#FFFFFF"/><text x="1310" y="605" class="transition" text-anchor="middle" >forward</text><path d="M 1700 630 L 1800 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="1639.75" y="581" width="220.5" height="31" fill="#FFFFFF"/><text x="1750" y="605" class="transition" text-anchor="middle" >eligible and verified</text><path d="M 2160 630 L 2260 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="2145" y="581" width="130" height="31" fill="#FFFFFF"/><text x="2210" y="605" class="transition" text-anchor="middle" >recommend</text><path d="M 2590 630 L 2690 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="2561.25" y="581" width="157.5" height="31" fill="#FFFFFF"/><text x="2640" y="605" class="transition" text-anchor="middle" >record approval</text><path d="M 3080 630 L 3180 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="3051.25" y="581" width="157.5" height="31" fill="#FFFFFF"/><text x="3130" y="605" class="transition" text-anchor="middle" >finalise record</text><path d="M 3460 630 L 3515 630" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="3420" y="581" width="130" height="31" fill="#FFFFFF"/><text x="3485" y="605" class="transition" text-anchor="middle" >close</text><g><rect x="980" y="190" width="460" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="1210" y="270" class="state-label" text-anchor="middle"><tspan x="1210" dy="0">Returned for Correction</tspan></text></g><path d="M 1080 560 L 1080 330" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="845.25" y="426" width="199.5" height="31" fill="#FFFFFF"/><text x="945" y="450" class="transition" text-anchor="middle" >evidence incomplete</text><path d="M 1530 560 L 1530 260 L 1440 260" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="1495.75" y="406" width="178.5" height="31" fill="#FFFFFF"/><text x="1585" y="430" class="transition" text-anchor="middle" >rejected evidence</text><path d="M 980 260 L 660 260 L 660 560" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="685" y="220" width="210" height="31" fill="#FFFFFF"/><text x="790" y="244" class="transition" text-anchor="middle" >correct and resubmit</text><g><rect x="1540" y="1010" width="430" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="1755" y="1073" class="state-label" text-anchor="middle"><tspan x="1755" dy="0">Further Review</tspan><tspan x="1755" dy="34">Required</tspan></text></g><path d="M 1530 700 L 1530 1080 L 1540 1080" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="1314.5" y="866" width="231" height="31" fill="#FFFFFF"/><text x="1430" y="890" class="transition" text-anchor="middle" >criteria not satisfied</text><path d="M 1980 700 L 1980 1080 L 1970 1080" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="1959.75" y="866" width="220.5" height="31" fill="#FFFFFF"/><text x="2070" y="890" class="transition" text-anchor="middle" >request clarification</text><path d="M 1755 1010 L 1755 910 L 1530 910 L 1530 700" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="1566.5" y="870" width="147" height="31" fill="#FFFFFF"/><text x="1640" y="894" class="transition" text-anchor="middle" >HR re-verifies</text><path d="M 1540 1080 L 1080 1080 L 1080 700" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="1174" y="1040" width="252" height="31" fill="#FFFFFF"/><text x="1300" y="1064" class="transition" text-anchor="middle" >department clarification</text><g><rect x="2260" y="1010" width="390" height="140" rx="28" fill="#FFFFFF" stroke="#111827" stroke-width="4"/><text x="2455" y="1090" class="state-label" text-anchor="middle"><tspan x="2455" dy="0">Not Recommended</tspan></text></g><path d="M 2070 700 L 2070 930 L 2455 930 L 2455 1010" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="2176" y="890" width="168" height="31" fill="#FFFFFF"/><text x="2260" y="914" class="transition" text-anchor="middle" >do not recommend</text><path d="M 2650 1080 L 3320 1080 L 3320 700" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><rect x="2880" y="1040" width="210" height="31" fill="#FFFFFF"/><text x="2985" y="1064" class="transition" text-anchor="middle" >record final outcome</text><rect x="120" y="1325" width="3360" height="92" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/><text x="150" y="1360" class="small" text-anchor="start" >Control rule: every state change is role-authorised, timestamped, and written to status history and the audit log.</text><text x="150" y="1395" class="small" text-anchor="start" >Terminal completion occurs after either authority approval or a formally recorded non-recommendation.</text>
</svg>

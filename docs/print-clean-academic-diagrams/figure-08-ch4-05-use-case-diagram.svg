"1640" y="1340" text-anchor="middle">Committee</text><text class="actorText" x="1640" y="1370" text-anchor="middle">Reviewer</text><ellipse class="node" cx="620" cy="280" rx="165" ry="59"/><text class="text" x="620" y="275" text-anchor="middle">Register / sign in</text><text class="text" x="620" y="303" text-anchor="middle">and complete profile</text><ellipse class="node" cx="620" cy="480" rx="165" ry="59"/><text class="text" x="620" y="475" text-anchor="middle">Create promotion</text><text class="text" x="620" y="503" text-anchor="middle">application</text><ellipse class="node" cx="620" cy="680" rx="165" ry="59"/><text class="text" x="620" y="675" text-anchor="middle">Upload evidence</text><text class="text" x="620" y="703" text-anchor="middle">documents</text><ellipse class="node" cx="620" cy="880" rx="165" ry="59"/><text class="text" x="620" y="875" text-anchor="middle">Track status and</text><text class="text" x="620" y="903" text-anchor="middle">read feedback</text><ellipse class="node" cx="900" cy="760" rx="165" ry="59"/><text class="text" x="900" y="755" text-anchor="middle">Review departmental</text><text class="text" x="900" y="783" text-anchor="middle">application</text><ellipse class="node" cx="900" cy="960" rx="165" ry="59"/><text class="text" x="900" y="955" text-anchor="middle">Forward, return, or</text><text class="text" x="900" y="983" text-anchor="middle">request review</text><ellipse class="node" cx="1180" cy="520" rx="165" ry="59"/><text class="text" x="1180" y="515" text-anchor="middle">Verify or reject</text><text class="text" x="1180" y="543" text-anchor="middle">evidence</text><ellipse class="node" cx="1180" cy="720" rx="165" ry="59"/><text class="text" x="1180" y="715" text-anchor="middle">View eligibility</text><text class="text" x="1180" y="743" text-anchor="middle">recommendation</text><ellipse class="node" cx="1180" cy="920" rx="165" ry="59"/><text class="text" x="1180" y="915" text-anchor="middle">Record final HR</text><text class="text" x="1180" y="943" text-anchor="middle">decision</text><ellipse class="node" cx="1180" cy="1120" rx="165" ry="59"/><text class="text" x="1180" y="1115" text-anchor="middle">Generate reports</text><text class="text" x="1180" y="1143" text-anchor="middle">and exports</text><ellipse class="node" cx="900" cy="1220" rx="165" ry="59"/><text class="text" x="900" y="1215" text-anchor="middle">Review verified</text><text class="text" x="900" y="1243" text-anchor="middle">application</text><ellipse class="node" cx="900" cy="1420" rx="165" ry="59"/><text class="text" x="900" y="1415" text-anchor="middle">Record committee</text><text class="text" x="900" y="1443" text-anchor="middle">recommendation</text><ellipse class="node" cx="620" cy="1540" rx="165" ry="59"/><text class="text" x="620" y="1535" text-anchor="middle">Manage users,</text><text class="text" x="620" y="1563" text-anchor="middle">faculties and departments</text><ellipse class="node" cx="620" cy="1740" rx="165" ry="59"/><text class="text" x="620" y="1735" text-anchor="middle">Configure promotion</text><text class="text" x="620" y="1763" text-anchor="middle">criteria</text><ellipse class="node" cx="900" cy="1740" rx="165" ry="59"/><text class="text" x="900" y="1735" text-anchor="middle">View audit logs</text><text class="text" x="900" y="1763" text-anchor="middle">and settings</text><ellipse class="node" cx="1180" cy="1320" rx="165" ry="59"/><text class="text" x="1180" y="1315" text-anchor="middle">Eligibility engine</text><text class="text" x="1180" y="1343" text-anchor="middle">calculates score</text><line class="thin" x1="220" y1="310" x2="455" y2="280"/><line class="thin" x1="220" y1="330" x2="455" y2="480"/><line class="thin" x1="220" y1="350" x2="455" y2="680"/><line class="thin" x1="220" y1="370" x2="455" y2="880"/><line class="thin" x1="220" y1="810" x2="735" y2="760"/><line class="thin" x1="220" y1="840" x2="735" y2="960"/><line class="thin" x1="1580" y1="555" x2="1345" y2="520"/><line class="thin" x1="1580"
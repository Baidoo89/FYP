  <style>
    .page{fill:#fff}.ink{stroke:#111111;stroke-width:3;fill:none}.thin{stroke:#222222;stroke-width:2;fill:none}.dash{stroke:#333333;stroke-width:2;stroke-dasharray:8 8;fill:none}.arrow{stroke:#111111;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .rel{stroke:#111111;stroke-width:2.4;fill:none;marker-end:url(#crow)}.label{font:600 24px Arial,Helvetica,sans-serif;fill:#111111}.text{font:500 23px Arial,Helvetica,sans-serif;fill:#111111}.small{font:500 20px Arial,Helvetica,sans-serif;fill:#222222}.tiny{font:500 18px Arial,Helvetica,sans-serif;fill:#222222}.head{font:700 28px Arial,Helvetica,sans-serif;fill:#fff}.entityHead{fill:#1f2937}.entity{fill:#fff;stroke:#111111;stroke-width:3}.fieldLine{stroke:#CFCFCF;stroke-width:1.5}.node{fill:#f9fafb;stroke:#111111;stroke-width:3}.decision{fill:#fff;stroke:#111111;stroke-width:3}.lane{fill:#FAFAFA;stroke:#8A8A8A;stroke-width:2}.actorText{font:700 24px Arial,Helvetica,sans-serif;fill:#111111}

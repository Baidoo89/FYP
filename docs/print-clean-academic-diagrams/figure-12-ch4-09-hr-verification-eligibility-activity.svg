<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980"><style id="PRINT_CLEAN_ACADEMIC_STYLE">
      text, tspan { fill: #111111 !important; font-family: Arial, Helvetica, sans-serif !important; }
      .node rect, .node polygon, .node circle, .node ellipse, rect, polygon, ellipse { vector-effect: non-scaling-stroke; }
      path, line, polyline { vector-effect: non-scaling-stroke; }
    </style><defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0,0 L13,6.5 L0,13 Z" fill="#111111"/></marker>
  </defs>
  <style>
    .page{fill:#fff}.lane{fill:#FAFAFA;stroke:#8A8A8A;stroke-width:2}.laneTitle{font:700 28px Arial,Helvetica,sans-serif;fill:#111111}.node{fill:#F6F6F6;stroke:#111111;stroke-width:2.6}.audit{fill:#F4F4F4;stroke:#111111;stroke-width:2.6}.warn{fill:#F1F1F1;stroke:#111111;stroke-width:2.6}.decision{fill:#FFFFFF;stroke:#111111;stroke-width:2.8}.terminal{fill:#111111;stroke:#111111;stroke-width:2.6}.terminalText{font:700 26px Arial,Helvetica,sans-serif;fill:#fff}.text{font:600 25px Arial,Helvetica,sans-serif;fill:#111111}.small{font:600 21px Arial,Helvetica,sans-serif;fill:#111111}.line{stroke:#111111;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#333333;stroke-width:2.8;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)}.labelBox{fill:#fff;stroke:#8A8A8A;stroke-width:1}.labelText{font:700 19px Arial,Helvetica,sans-serif;fill:#111111}
  </style><rect class="page" width="1800" height="980"/><rect class="terminal" x="30" y="118" width="140" height="64" rx="32"/><text class="terminalText" x="100" y="150" text-anchor="middle" dominant-baseline="middle">Start</text><rect class="node" x="210" y="105" width="240" height="90" rx="16"/><text class="text" x="330" y="135" text-anchor="middle" dominant-baseline="middle">Open HR</text><text class="text" x="330" y="165" text-anchor="middle" dominant-baseline="middle">master queue</text><rect class="node" x="545" y="105" width="240" height="90" rx="16"/><text class="text" x="665" y="135" text-anchor="middle" dominant-baseline="middle">Select</text><text class="text" x="665" y="165" text-anchor="middle" dominant-baseline="middle">application</text><rect class="node" x="880" y="105" width="260" height="90" rx="16"/><text class="text" x="1010" y="135" text-anchor="middle" dominant-baseline="middle">Confirm staff</text><text class="text" x="1010" y="165" text-anchor="middle" dominant-baseline="middle">and rank history</text><rect class="node" x="1235" y="105" width="260" height="90" rx="16"/><text class="text" x="1365" y="135" text-anchor="middle" dominant-baseline="middle">Verify uploaded</text><text class="text" x="1365" y="165" text-anchor="middle" dominant-baseline="middle">documents</text><polygon class="decision" points="1510,250 1640,325 1510,400 1380,325"/><text class="text" x="1510" y="311" text-anchor="middle" dominant-baseline="middle">Document</text><text class="text" x="1510" y="339" text-anchor="middle" dominant-baseline="middle">valid?</text><rect class="warn" x="1235" y="560" width="260" height="82" rx="16"/><text class="text" x="1365" y="586" text-anchor="middle" dominant-baseline="middle">Reject or request</text><text class="text" x="1365" y="616" text-anchor="middle" dominant-baseline="middle">correction</text><polygon class="decision" points="1020,265 1155,340 1020,415 885,340"/><text class="text" x="1020" y="326" text-anchor="middle" dominant-baseline="middle">Required</text><text class="text" x="1020" y="354" text-anchor="middle" dominant-baseline="middle">categories verified?</text><rect class="warn" x="740" y="560" width="260" height="82" rx="16"/><text class="text" x="870" y="586" text-anchor="middle" dominant-baseline="middle">Keep under HR</text><text class="text" x="870" y="616" text-anchor="middle" dominant-baseline="middle">verification</text><rect class="node" x="540" y="295" width="260" height="90" rx="16"/><text class="text" x="670" y="325" text-anchor="middle" dominant-baseline="middle">Run eligibility</text><text class="text" x="670" y="355" text-anchor="middle" dominant-baseline="middle">engine</text><rect class="node" x="210" y="295" width="260" height="90" rx="16"/><text class="text" x="340" y="325" text-anchor="middle" dominant-baseline="middle">Compute score from</text><text class="text" x="340" y="355" text-anchor="middle" dominant-baseline="middle">verified evidence</text><polygon class="decision" points="330,485 465,560 330,635 195,560"/><text class="text" x="330" y="546" text-anchor="middle" dominant-baseline="middle">Eligibility</text><text class="text" x="330" y="574" text-anchor="middle" dominant-baseline="middle">outcome?</text><rect class="node" x="690" y="760" width="270" height="82" rx="16"/><text class="text" x="825" y="786" text-anchor="middle" dominant-baseline="middle">Route eligible file</text><text class="text" x="825" y="816" text-anchor="middle" dominant-baseline="middle">to committee</text><rect class="warn" x="210" y="760" width="270" height="82" rx="16"/><text class="text" x="345" y="786" text-anchor="middle" dominant-baseline="middle">Mark not eligible or</text><text class="text" x="345" y="816" text-anchor="middle" dominant-baseline="middle">requires review</text><rect class="audit" x="1100" y="760" width="340" height="90" rx="16"/><text class="text" x="1270" y="790" text-anchor="middle" dominant-baseline="middle">Save verification, audit trail,</text><text class="text" x="1270" y="820" text-anchor="middle" dominant-baseline="middle">status history and notifications</text><rect class="terminal" x="1530" y="773" width="140" height="64" rx="32"/><text class="terminalText" x="1600" y="805" text-anchor="middle" dominant-baseline="middle">End</text><path class="line" d="M170,150 L210,150"/><path class="line" d="M450,150 L545,150"/><path class="line" d="M785,150 L880,150"/><path class="line" d="M1140,150 L1235,150"/><path class="line" d="M1365,195 L1510,250"/><path class="line" d="M1510,400 L1365,560"/><rect class="labelBox" x="1389.5" y="454" width="96" height="28" rx="4"/><text class="labelText" x="1437.5" y="474" text-anchor="middle">No</text><path class="line" d="M1380,325 L1155,340"/><rect class="labelBox" x="1219.5" y="306.5" width="96" height="28" rx="4"/><text class="labelText" x="1267.5" y="326.5" text-anchor="middle">Yes</text><path class="line" d="M885,340 L800,560"/><rect class="labelBox" x="794.5" y="424" width="96" height="28" rx="4"/><text class="labelText" x="842.5" y="444" text-anchor="middle">No</text><path class="line" d="M1020,265 L670,295"/><rect class="labelBox" x="797" y="254" width="96" height="28" rx="4"/><text class="labelText" x="845" y="274" text-anchor="middle">Yes</text><path class="line" d="M540,340 L470,340"/><path class="line" d="M330,385 L330,485"/><path class="line" d="M430,610 L690,800"/><rect class="labelBox" x="512" y="679" width="96" height="28" rx="4"/><text class="labelText" x="560" y="699" text-anchor="middle">Eligible</text><path class="line" d="M330,635 L345,760"/><rect class="labelBox" x="289.5" y="671.5" width="96" height="28" rx="4"/><text class="labelText" x="337.5" y="691.5" text-anchor="middle">Other</text><path class="line" d="M960,800 L1100,805"/><path class="line" d="M480,800 L1100,805"/><path class="line" d="M1495,805 L1530,805"/><path class="line" d="M1365,601 L1100,805"/><path class="line" d="M870,601 L1100,805"/></svg>
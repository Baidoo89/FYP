<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980"><style id="PRINT_CLEAN_ACADEMIC_STYLE">
      text, tspan { fill: #111111 !important; font-family: Arial, Helvetica, sans-serif !important; }
      .node rect, .node polygon, .node circle, .node ellipse, rect, polygon, ellipse { vector-effect: non-scaling-stroke; }
      path, line, polyline { vector-effect: non-scaling-stroke; }
    </style><defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0,0 L13,6.5 L0,13 Z" fill="#111111"/></marker>
  </defs>
  <style>
    .page{fill:#fff}.lane{fill:#FAFAFA;stroke:#8A8A8A;stroke-width:2}.laneTitle{font:700 28px Arial,Helvetica,sans-serif;fill:#111111}.node{fill:#F6F6F6;stroke:#111111;stroke-width:2.6}.audit{fill:#F4F4F4;stroke:#111111;stroke-width:2.6}.warn{fill:#F1F1F1;stroke:#111111;stroke-width:2.6}.decision{fill:#FFFFFF;stroke:#111111;stroke-width:2.8}.terminal{fill:#111111;stroke:#111111;stroke-width:2.6}.terminalText{font:700 26px Arial,Helvetica,sans-serif;fill:#fff}.text{font:600 25px Arial,Helvetica,sans-serif;fill:#111111}.small{font:600 21px Arial,Helvetica,sans-serif;fill:#111111}.line{stroke:#111111;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#333333;stroke-width:2.8;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)}.labelBox{fill:#fff;stroke:#8A8A8A;stroke-width:1}.labelText{font:700 19px Arial,Helvetica,sans-serif;fill:#111111}
  </style><rect class="page" width="1800" height="980"/><rect class="terminal" x="50" y="128" width="140" height="64" rx="32"/><text class="terminalText" x="120" y="160" text-anchor="middle" dominant-baseline="middle">Start</text><rect class="node" x="230" y="115" width="260" height="90" rx="16"/><text class="text" x="360" y="145" text-anchor="middle" dominant-baseline="middle">Sign in with</text><text class="text" x="360" y="175" text-anchor="middle" dominant-baseline="middle">GCTU email</text><polygon class="decision" points="620,87.5 745,160 620,232.5 495,160"/><text class="text" x="620" y="146" text-anchor="middle" dominant-baseline="middle">Profile</text><text class="text" x="620" y="174" text-anchor="middle" dominant-baseline="middle">complete?</text><rect class="warn" x="500" y="355" width="240" height="82" rx="16"/><text class="text" x="620" y="381" text-anchor="middle" dominant-baseline="middle">Complete staff</text><text class="text" x="620" y="411" text-anchor="middle" dominant-baseline="middle">profile</text><rect class="node" x="840" y="115" width="260" height="90" rx="16"/><text class="text" x="970" y="145" text-anchor="middle" dominant-baseline="middle">Select current</text><text class="text" x="970" y="175" text-anchor="middle" dominant-baseline="middle">and target rank</text><rect class="node" x="1180" y="115" width="260" height="90" rx="16"/><text class="text" x="1310" y="145" text-anchor="middle" dominant-baseline="middle">Create draft</text><text class="text" x="1310" y="175" text-anchor="middle" dominant-baseline="middle">application</text><rect class="node" x="1460" y="305" width="260" height="90" rx="16"/><text class="text" x="1590" y="335" text-anchor="middle" dominant-baseline="middle">Upload PDF evidence</text><text class="text" x="1590" y="365" text-anchor="middle" dominant-baseline="middle">by category</text><polygon class="decision" points="1195,277.5 1325,350 1195,422.5 1065,350"/><text class="text" x="1195" y="336" text-anchor="middle" dominant-baseline="middle">File and</text><text class="text" x="1195" y="364" text-anchor="middle" dominant-baseline="middle">category valid?</text><rect class="warn" x="870" y="555" width="245" height="82" rx="16"/><text class="text" x="992.5" y="581" text-anchor="middle" dominant-baseline="middle">Replace invalid</text><text class="text" x="992.5" y="611" text-anchor="middle" dominant-baseline="middle">evidence</text><polygon class="decision" points="620,535 755,610 620,685 485,610"/><text class="text" x="620" y="596" text-anchor="middle" dominant-baseline="middle">All required</text><text class="text" x="620" y="624" text-anchor="middle" dominant-baseline="middle">categories present?</text><rect class="node" x="250" y="565" width="255" height="90" rx="16"/><text class="text" x="377.5" y="595" text-anchor="middle" dominant-baseline="middle">Submit</text><text class="text" x="377.5" y="625" text-anchor="middle" dominant-baseline="middle">application</text><rect class="node" x="250" y="800" width="255" height="90" rx="16"/><text class="text" x="377.5" y="830" text-anchor="middle" dominant-baseline="middle">Track status,</text><text class="text" x="377.5" y="860" text-anchor="middle" dominant-baseline="middle">comments and outcome</text><rect class="terminal" x="550" y="813" width="140" height="64" rx="32"/><text class="terminalText" x="620" y="845" text-anchor="middle" dominant-baseline="middle">End</text><rect class="warn" x="870" y="800" width="260" height="82" rx="16"/><text class="text" x="1000" y="826" text-anchor="middle" dominant-baseline="middle">Correction received</text><text class="text" x="1000" y="856" text-anchor="middle" dominant-baseline="middle">from reviewer</text><path class="line" d="M190,160 L230,160"/><path class="line" d="M490,160 L495,160"/><path class="line" d="M745,160 L840,160"/><rect class="labelBox" x="744.5" y="134" width="96" height="28" rx="4"/><text class="labelText" x="792.5" y="154" text-anchor="middle">Yes</text><path class="line" d="M620,232 L620,355"/><rect class="labelBox" x="572" y="267.5" width="96" height="28" rx="4"/><text class="labelText" x="620" y="287.5" text-anchor="middle">No</text><path class="dash" d="M500,396 C350,396 350,160 495,160"/><rect class="labelBox" x="318" y="286" width="144" height="28" rx="4"/><text class="labelText" x="390" y="306" text-anchor="middle">update</text><path class="line" d="M1100,160 L1180,160"/><path class="line" d="M1440,160 L1545,305"/><path class="line" d="M1460,350 L1325,350"/><path class="line" d="M1065,350 L755,610"/><rect class="labelBox" x="862" y="454" width="96" height="28" rx="4"/><text class="labelText" x="910" y="474" text-anchor="middle">Yes</text><path class="line" d="M1195,423 L995,555"/><rect class="labelBox" x="1047" y="463" width="96" height="28" rx="4"/><text class="labelText" x="1095" y="483" text-anchor="middle">No</text><path class="dash" d="M870,596 C760,596 760,350 1065,350"/><rect class="labelBox" x="698" y="491" width="144" height="28" rx="4"/><text class="labelText" x="770" y="511" text-anchor="middle">retry</text><path class="dash" d="M755,610 C1010,710 1620,610 1590,395"/><rect class="labelBox" x="1208" y="681" width="144" height="28" rx="4"/><text class="labelText" x="1280" y="701" text-anchor="middle">add evidence</text><path class="line" d="M485,610 L377,565"/><rect class="labelBox" x="383" y="561.5" width="96" height="28" rx="4"/><text class="labelText" x="431" y="581.5" text-anchor="middle">Yes</text><path class="line" d="M377,655 L377,800"/><path class="line" d="M505,845 L550,845"/><path class="dash" d="M870,840 C760,840 760,410 1325,350"/><rect class="labelBox" x="738" y="736" width="144" height="28" rx="4"/><text class="labelText" x="810" y="756" text-anchor="middle">resubmit</text></svg>